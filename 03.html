<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#191713" />

  <!-- iPhone 主屏幕 Web App / PWA 相关 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Upside" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Upside Camera</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --cream: #ede3ca;
      --metal: #c5b89c;
      --dark: #171511;
      --leather: #27231d;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0e0d0b;
      color: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      min-height: 100svh;
      touch-action: manipulation;
    }

    button { font: inherit; }

    .camera-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.045) 0 1px, transparent 1.5px) 0 0/14px 14px,
        repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 1px, transparent 1px 5px),
        var(--leather);
    }

    /* 顶部复古金属区 */
    .top-plate {
      position: absolute;
      inset: 0 0 auto;
      height: 17.5svh;
      min-height: 122px;
      padding: calc(13px + var(--safe-top)) 18px 13px;
      display: grid;
      grid-template-columns: 74px 1fr 82px;
      align-items: end;
      gap: 12px;
      background:
        linear-gradient(#d0c4aa, #a89b80 48%, #796f60 49%, #b4a78b 53%, #8f826d);
      border-bottom: 2px solid #4e473d;
      box-shadow: 0 8px 18px rgba(0,0,0,.4);
      color: #1e1b17;
      z-index: 5;
    }

    .dial-wrap, .counter-wrap {
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    .dial {
      width: 54px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 4px solid #5e5548;
      background:
        repeating-conic-gradient(from 0deg, #2f2b25 0 4deg, #b4a88e 4deg 8deg),
        radial-gradient(circle, #91856f 0 52%, #2d2923 53% 60%, transparent 61%);
      box-shadow: inset 0 0 0 5px #a99d84, 0 3px 8px rgba(0,0,0,.45);
      position: relative;
    }

    .dial::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 16px;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: #e9dfc7;
      border-radius: 2px;
    }

    .micro {
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 7px;
      font-weight: 800;
    }

    .brand {
      align-self: center;
      text-align: center;
    }

    .brand-main {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 8vw, 38px);
      line-height: .9;
      font-style: italic;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand-sub {
      margin-top: 9px;
      font-family: ui-monospace, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: 6px;
      font-weight: 700;
    }

    .counter {
      width: 66px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 4px solid #4c453a;
      border-radius: 7px;
      background: #1a1d18;
      color: #e8d9a7;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 24px;
      letter-spacing: .1em;
      box-shadow: inset 0 0 10px #000, 0 2px 6px rgba(0,0,0,.35);
    }

    /* 中间信息条 */
    .info-row {
      position: absolute;
      left: 20px;
      right: 20px;
      top: calc(23svh + var(--safe-top) * .15);
      z-index: 6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b8ab91;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10px;
      letter-spacing: .12em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      margin-right: 7px;
      display: inline-block;
      border-radius: 50%;
      background: #777064;
    }

    .status-dot.on {
      background: #b84c3f;
      box-shadow: 0 0 10px rgba(184,76,63,.8);
    }

    /*
      核心优化：
      取景器从约屏幕 1/3 处开始，一直延伸到屏幕底部。
      不再给“快门区”预留任何空间。
    */
    .viewfinder-frame {
      position: absolute;
      left: clamp(12px, 3.8vw, 22px);
      right: clamp(12px, 3.8vw, 22px);
      top: 31.5svh;
      bottom: calc(8px + var(--safe-bottom));
      padding: clamp(10px, 3vw, 16px);
      border-radius: 22px;
      background:
        linear-gradient(135deg, #786d5d, #c6b99c 24%, #5d5549 25%, #a89b82 52%, #50493f 53%, #b3a78e 80%, #756b5b);
      border: 1px solid #d8ccb1;
      box-shadow:
        0 18px 32px rgba(0,0,0,.45),
        inset 0 0 0 2px rgba(25,22,18,.4),
        inset 0 0 18px rgba(255,255,255,.25);
      z-index: 3;
    }

    .viewfinder-frame::before,
    .viewfinder-frame::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 30%;
      height: 7px;
      border-radius: 8px;
      background: #29251f;
    }

    .viewfinder-frame::before { top: 4px; }
    .viewfinder-frame::after { bottom: 4px; }

    .viewfinder {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #080907;
      border: 7px solid #171713;
      box-shadow: inset 0 0 35px rgba(0,0,0,.9), 0 0 0 2px #514b41;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(.82) contrast(1.08) sepia(.08) brightness(.94);
      transform: scale(-1.035, -1.035);
    }

    video.vertical-flip   { transform: scale(1.035, -1.035); }
    video.horizontal-flip { transform: scale(-1.035, 1.035); }
    video.normal          { transform: scale(1.035); }

    .vignette, .grain, .grid-lines, .focus-box, .start-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .vignette {
      background: radial-gradient(circle, transparent 44%, rgba(0,0,0,.17) 70%, rgba(0,0,0,.62) 115%);
    }

    .grain {
      opacity: .10;
      mix-blend-mode: screen;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }

    .grid-lines {
      display: none;
      background:
        linear-gradient(to right, transparent 33.1%, rgba(235,225,197,.32) 33.2% 33.6%, transparent 33.7% 66.3%, rgba(235,225,197,.32) 66.4% 66.8%, transparent 66.9%),
        linear-gradient(to bottom, transparent 33.1%, rgba(235,225,197,.32) 33.2% 33.6%, transparent 33.7% 66.3%, rgba(235,225,197,.32) 66.4% 66.8%, transparent 66.9%);
    }
    .grid-lines.show { display: block; }

    .focus-box {
      inset: 50% auto auto 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(238,225,192,.72);
      opacity: .58;
    }

    .focus-box::before, .focus-box::after {
      content: "";
      position: absolute;
      background: rgba(238,225,192,.8);
    }
    .focus-box::before { width: 16px; height: 1px; left: 20px; top: 28px; }
    .focus-box::after  { width: 1px; height: 16px; left: 28px; top: 20px; }

    .start-layer {
      z-index: 8;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #1f241d, #090a08 72%);
      pointer-events: auto;
      transition: opacity .25s ease;
    }
    .start-layer.hidden { opacity: 0; pointer-events: none; }

    .start-card {
      width: min(78%, 280px);
      text-align: center;
      color: #e7dcc0;
    }

    .mini-lens {
      width: 84px;
      aspect-ratio: 1;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 10px solid #2b2b25;
      background:
        radial-gradient(circle at 38% 35%, rgba(178,198,188,.28), transparent 13%),
        radial-gradient(circle, #1d302b 0 16%, #111c1a 17% 33%, #050706 34% 57%, #32322c 58% 62%, #10110e 63%);
      box-shadow: 0 0 0 4px #77705f, 0 10px 18px rgba(0,0,0,.45);
    }

    .start-card h1 {
      margin: 0 0 8px;
      font: italic 800 27px/1 Georgia, serif;
    }

    .start-card p {
      margin: 0 0 18px;
      color: #a99e87;
      font-size: 12px;
      line-height: 1.6;
    }

    .primary-btn {
      width: 100%;
      min-height: 48px;
      border: 1px solid #e8dcc0;
      border-radius: 6px;
      background: #c6b697;
      color: #1b1814;
      font-weight: 800;
      letter-spacing: .12em;
      box-shadow: 0 5px 0 #615849;
    }

    /* 控制按钮悬浮在取景器底部，不再占用固定机身区域 */
    .control-strip {
      position: absolute;
      left: 50%;
      bottom: calc(16px + var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 10;
      width: min(86%, 360px);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      padding: 7px;
      border: 1px solid rgba(197,184,156,.30);
      border-radius: 10px;
      background: rgba(23,21,17,.72);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,.32);
    }

    .small-btn {
      min-height: 40px;
      border: 1px solid #5e564a;
      border-radius: 6px;
      background: rgba(35,32,27,.86);
      color: #d8ccb1;
      font-size: 10px;
      font-family: ui-monospace, Menlo, monospace;
      letter-spacing: .07em;
    }

    .small-btn.active { color: #fff2cc; }

    /* 主屏幕 Web App 时，占满整个可用窗口 */
    @media (display-mode: standalone) {
      .top-plate { padding-top: calc(8px + var(--safe-top)); }
      .viewfinder-frame { bottom: calc(4px + var(--safe-bottom)); }
    }

    /* 小屏 iPhone 微调 */
    @media (max-height: 720px) {
      .top-plate { height: 16.5svh; min-height: 104px; }
      .info-row { top: 22svh; }
      .viewfinder-frame { top: 30.5svh; }
      .dial { width: 46px; }
      .counter { height: 35px; }
    }
  </style>
</head>

<body>
  <main class="camera-shell">
    <header class="top-plate">
      <div class="dial-wrap">
        <div class="dial"></div>
        <div class="micro">EXPOSURE</div>
      </div>

      <div class="brand">
        <div class="brand-main">Upside</div>
        <div class="brand-sub">Experimental Camera</div>
      </div>

      <div class="counter-wrap">
        <div class="counter">00</div>
        <div class="micro">FRAME</div>
      </div>
    </header>

    <div class="info-row">
      <span><i id="statusDot" class="status-dot"></i><span id="statusText">CAMERA OFF</span></span>
      <span id="modeText">BOTH FLIP</span>
    </div>

    <div class="viewfinder-frame">
      <div class="viewfinder">
        <video id="video" autoplay muted playsinline></video>
        <div class="vignette"></div>
        <div class="grain"></div>
        <div id="grid" class="grid-lines"></div>
        <div class="focus-box"></div>

        <div id="startLayer" class="start-layer">
          <div class="start-card">
            <div class="mini-lens"></div>
            <h1>Upside Camera</h1>
            <p>打开摄像头后会默认上下 + 左右翻转。点击时也会尝试进入浏览器支持的全屏模式。</p>
            <button id="startBtn" class="primary-btn" type="button">打开摄像头</button>
          </div>
        </div>
      </div>
    </div>

    <div class="control-strip">
      <button id="transformBtn" class="small-btn active" type="button">上下+左右</button>
      <button id="gridBtn" class="small-btn" type="button">九宫格</button>
      <button id="cameraBtn" class="small-btn" type="button">前后镜头</button>
    </div>
  </main>

  <script>
    const video = document.getElementById('video');
    const startLayer = document.getElementById('startLayer');
    const startBtn = document.getElementById('startBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const transformBtn = document.getElementById('transformBtn');
    const gridBtn = document.getElementById('gridBtn');
    const grid = document.getElementById('grid');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const modeText = document.getElementById('modeText');

    let stream = null;
    let facingMode = 'environment';
    let transformMode = 'both'; // both | vertical | horizontal | normal

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    async function tryFullscreen() {
      // Fullscreen API 通常必须由用户手势触发；iPhone 浏览器不保证支持。
      const el = document.documentElement;
      try {
        if (!document.fullscreenElement && el.requestFullscreen) {
          await el.requestFullscreen({ navigationUI: 'hide' });
        }
      } catch (_) {}
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        alert('当前浏览器无法调用摄像头。建议把页面部署到 HTTPS 后再打开。');
        return;
      }

      stopStream();
      statusText.textContent = 'STARTING';

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1440 }
          }
        });

        video.srcObject = stream;
        await video.play();

        startLayer.classList.add('hidden');
        statusDot.classList.add('on');
        statusText.textContent = facingMode === 'environment' ? 'REAR CAMERA' : 'FRONT CAMERA';
      } catch (err) {
        console.error(err);
        statusDot.classList.remove('on');
        statusText.textContent = 'PERMISSION NEEDED';
        startLayer.classList.remove('hidden');
        alert('无法打开摄像头。请允许摄像头权限，并尽量通过 HTTPS 地址访问。');
      }
    }

    function applyTransform() {
      video.classList.remove('vertical-flip', 'horizontal-flip', 'normal');

      if (transformMode === 'both') {
        transformBtn.textContent = '上下+左右';
        modeText.textContent = 'BOTH FLIP';
        transformBtn.classList.add('active');
      } else if (transformMode === 'vertical') {
        video.classList.add('vertical-flip');
        transformBtn.textContent = '仅上下';
        modeText.textContent = 'VERTICAL';
      } else if (transformMode === 'horizontal') {
        video.classList.add('horizontal-flip');
        transformBtn.textContent = '仅左右';
        modeText.textContent = 'HORIZONTAL';
      } else {
        video.classList.add('normal');
        transformBtn.textContent = '正常';
        modeText.textContent = 'NORMAL';
        transformBtn.classList.remove('active');
      }
    }

    function cycleTransform() {
      transformMode =
        transformMode === 'both' ? 'vertical' :
        transformMode === 'vertical' ? 'horizontal' :
        transformMode === 'horizontal' ? 'normal' : 'both';
      applyTransform();
    }

    startBtn.addEventListener('click', async () => {
      await tryFullscreen();
      await startCamera();
    });

    cameraBtn.addEventListener('click', async () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      await startCamera();
    });

    transformBtn.addEventListener('click', cycleTransform);

    gridBtn.addEventListener('click', () => {
      grid.classList.toggle('show');
      gridBtn.classList.toggle('active');
    });

    document.addEventListener('visibilitychange', () => {
      if (!stream) return;
      stream.getVideoTracks().forEach(track => track.enabled = !document.hidden);
    });

    window.addEventListener('pagehide', stopStream);
    applyTransform();
  </script>
</body>
</html>
